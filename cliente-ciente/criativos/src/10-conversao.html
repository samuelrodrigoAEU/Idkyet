<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { background: var(--terracota); }
  .frame { color: var(--papel); }
  .cartao { margin-top: 60px; background: var(--papel); color: var(--tinta); border-radius: 36px; padding: 60px 56px 56px; flex: 1; display: flex; flex-direction: column; }
  .cartao .kicker { color: var(--terracota); }
  .nome { font-family: "Fraunces", serif; font-weight: 800; font-size: 118px; line-height: .95; letter-spacing: -2px; margin-top: 18px; }
  .desc { font-size: 34px; line-height: 1.3; color: var(--cinza); margin-top: 28px; }
  .luzes { display: flex; gap: 14px; margin-top: 36px; }
  .luzes .dot { width: 30px; height: 30px; }
  .preco { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
  .preco .v { font-family: "Fraunces", serif; font-weight: 800; font-size: 130px; line-height: 1; }
  .preco .v small { font-size: 50px; vertical-align: 52px; margin-right: 6px; }
  .preco .d { font-size: 24px; color: var(--cinza); text-align: right; line-height: 1.5; }
  .cta { background: var(--tinta); margin-top: 40px; justify-content: center; font-size: 38px; padding: 30px; }
  body.s11 .cartao { margin-top: 30px; padding: 40px 48px; }
  body.s11 .nome { font-size: 92px; }
  body.s11 .desc { font-size: 28px; margin-top: 16px; }
  body.s11 .luzes { display: none; }
  body.s11 .preco .v { font-size: 100px; }
  body.s11 .cta { margin-top: 26px; padding: 22px; }
</style></head><body><div class="frame">
  <div class="marca"><span class="selo">✓</span>Cliente Ciente</div>
  <div class="cartao">
    <div class="kicker">Kit digital · acesso imediato</div>
    <div class="nome">Cliente Ciente</div>
    <div class="desc">Fichas, termos e regras de agenda prontos para quem atende sobrancelha, cílios e unhas.</div>
    <div class="luzes"><span class="dot v"></span><span class="dot a"></span><span class="dot r"></span></div>
    <div class="preco"><span class="v"><small>R$</small>27</span><span class="d">pagamento único<br>7 dias para pedir reembolso</span></div>
  </div>
  <span class="cta">Comprar agora <span class="seta">→</span></span>
</div></body></html>
